rules:
  - id: java-taint-sqli-high
    languages: [java]
    mode: taint
    severity: ERROR
    message: >
      User input flows into database query without sanitization, SQL injection risk.
    metadata:
      cwe:
        - "CWE-89: Improper Neutralization of Special Elements used in an SQL Command"
    pattern-sources:
      - pattern: request.getParameter($KEY)
      - pattern: request.getHeader($KEY)
    pattern-sinks:
      - pattern: $STATEMENT.executeQuery($SQL)
      - pattern: $STATEMENT.execute($SQL)
      - pattern: $STATEMENT.executeUpdate($SQL)

  - id: java-taint-cmdi-high
    languages: [java]
    mode: taint
    severity: ERROR
    message: >
      User input flows into command execution without sanitization, command injection risk.
    metadata:
      cwe:
        - "CWE-78: Improper Neutralization of Special Elements used in an OS Command"
    pattern-sources:
      - pattern: request.getParameter($KEY)
      - pattern: request.getHeader($KEY)
    pattern-sinks:
      - pattern: Runtime.getRuntime().exec($CMD)
      - pattern: new ProcessBuilder($CMD)

  - id: java-taint-path-traversal-high
    languages: [java]
    mode: taint
    severity: ERROR
    message: >
      User input flows into file operations without validation, path traversal risk.
    metadata:
      cwe:
        - "CWE-22: Improper Limitation of a Pathname to a Restricted Directory"
    pattern-sources:
      - pattern: request.getParameter($KEY)
      - pattern: request.getHeader($KEY)
    pattern-sinks:
      - pattern: new FileInputStream($PATH)
      - pattern: Paths.get($PATH)
      - pattern: new File($PATH)

  - id: java-taint-deserialization-high
    languages: [java]
    mode: taint
    severity: ERROR
    message: >
      User input flows into object deserialization without validation, unsafe deserialization risk.
    metadata:
      cwe:
        - "CWE-502: Deserialization of Unsafe Data"
    pattern-sources:
      - pattern: request.getParameter($KEY)
      - pattern: request.getHeader($KEY)
    pattern-sinks:
      - pattern: new ObjectInputStream($STREAM).readObject()
