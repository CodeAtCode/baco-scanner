# BACO Corpus Manifest — WordPress Plugin Scanner Regression Tests
#
# Ground truth for measuring precision and recall. Each case is decided ONCE
# by hand, so metrics move when the scanner changes, not when opinions shift.
#
# Format: TOML table with expected findings per fixture.

[[cases]]
id = "tp-01"
fixture = "fixtures/tp_ajax_handler.php"
language = "php"
description = "Unprotected wp_ajax handler - missing CSRF/authorization"
expected_findings = [
    { line = 5, cwe = "CWE-352", description = "delete_post_handler has no nonce check or current_user_can" }
]
expected_refutation = false  # Should NOT be refuted - genuinely vulnerable

[[cases]]
id = "tp-02"
fixture = "fixtures/tp_admin_post.php"
language = "php"
description = "Unprotected admin_post handler"
expected_findings = [
    { line = 5, cwe = "CWE-352", description = "flush_cache_action has no check_admin_referer or current_user_can" }
]
expected_refutation = false  # Should NOT be refuted - genuinely vulnerable

[[cases]]
id = "tp-03"
fixture = "fixtures/tp_sqli_concat.php"
language = "php"
description = "SQL injection via string concatenation"
expected_findings = [
    { line = 4, cwe = "CWE-89", description = "get_user_posts builds SQL with unprepared concatenation" }
]
expected_refutation = false  # Should NOT be refuted - genuinely vulnerable

[[cases]]
id = "tp-04"
fixture = "fixtures/tp_xss_echo.php"
