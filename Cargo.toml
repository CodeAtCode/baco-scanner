[package]
name = "baco"
version = "1.1.0"
edition = "2021"
homepage = "https://github.com/CodeAtCode/baco-scanner"
documentation = "https://github.com/CodeAtCode/baco-scanner/tree/master/docs"
description = "LLM-augmented SAST scanner: 24-phase pipeline combining semgrep, CWE-aware MoE routing, and research-backed LLM verification"
authors = ["MTE90"]
repository = "https://github.com/CodeAtCode/baco-scanner"
license = "GPL-3.0"
keywords = ["security", "vulnerability", "scanner", "sast", "llm"]
categories = ["command-line-utilities", "development-tools"]
rust-version = "1.74"

[dependencies]
# Async trait support
async-trait = "0.1"

# CLI
clap = { version = "4", features = ["derive"] }

# Colored output
colored = "3.1"

# Progress
indicatif = "0.17"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# HTML escaping
html-escape = "0.2"
pulldown-cmark = "0.9"

# HTTP clients
reqwest = { version = "0.12", features = ["json"] }
urlencoding = "2"

# File system
walkdir = "2"

# Git
git2 = "0.19"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Hashing
sha2 = "0.10"
hex = "0.4"
which = "6"

thiserror = "1.0"
tempfile = "3"
regex = "1"

# Tree-sitter for AST parsing
tree-sitter = "0.26"
tree-sitter-c = "0.23"
tree-sitter-rust = "0.23"
tree-sitter-python = "0.23"
tree-sitter-javascript = "0.23"

# Static analysis support
once_cell = "1.19"

[dev-dependencies]
mockall = "0.13"
serial_test = "3"
futures = "0.3"
mockito = "1.2"
visibility = "0.1"
tempfile = "3"

[[test]]
name = "unit_tests"
path = "tests/unit/mod.rs"

[[test]]
name = "integration_tests"
path = "tests/integration/mod.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
