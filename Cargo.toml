[package]
name = "baco"
version = "0.1.0"
edition = "2021"
description = "CLI Vulnerability Scanner"
authors = ["MTE90"]
repository = "https://github.com/mte90/baco"
license = "MIT"
keywords = ["security", "vulnerability", "scanner", "cli", "sast"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
# Async trait support
async-trait = "0.1"

# CLI
clap = { version = "4", features = ["derive"] }

# Colored output
colored = "3.1"

# Progress
indicatif = "0.17"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# HTML escaping
html-escape = "0.2"
pulldown-cmark = "0.9"

# HTTP clients
reqwest = { version = "0.12", features = ["json"] }
urlencoding = "2"

# File system
walkdir = "2"

# Git
git2 = "0.19"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Hashing
sha2 = "0.10"
hex = "0.4"
which = "6"

thiserror = "1.0"
tempfile = "3"
regex = "1"

[dev-dependencies]
mockall = "0.13"
serial_test = "3"
futures = "0.3"
mockito = "1.2"
visibility = "0.1"

[[test]]
name = "unit_tests"
path = "tests/unit/mod.rs"

[[test]]
name = "integration_tests"
path = "tests/integration/mod.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
