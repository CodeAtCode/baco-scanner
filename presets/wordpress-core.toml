# BACO preset — WordPress core (requires T38 PHP support)
# Usage: baco scan --config my.toml --preset wordpress-core

[project]
name = "wordpress-core"
path = "./wordpress"
languages = ["php", "javascript"]

[scanner]
max_file_size_kb = 256
exclude_paths = [
  "wp-content/*",
  "wp-includes/js/*",
  "wp-includes/ID3/*",
  "wp-includes/Requests/*",
  "wp-includes/SimplePie/*",
  "wp-includes/Text/*",
  "tests/*", "tools/*", "docs/*", "src/wp-includes/js/*",
  "*.min.js",
]

[scanner.semgrep]
rulesets = ["p/wordpress", "p/php", "p/security"]
# Inline semgrep rules, materialized to temp files at scan time and passed as
# extra --config args. Keeps the preset self-contained (no external rules file).
custom_rules = ['''
rules:
  - id: wp-superglobal-file-read-high
    languages: [php]
    severity: ERROR
    message: >
      Reads a file path directly from a request superglobal, allowing arbitrary
      file read / path traversal.
    metadata:
      cwe:
        - "CWE-22: Improper Limitation of a Pathname to a Restricted Directory"
    pattern-either:
      - pattern: file_get_contents($_GET[$KEY])
      - pattern: file_get_contents($_REQUEST[$KEY])
      - pattern: file_get_contents($_POST[$KEY])
      - pattern: readfile($_GET[$KEY])
      - pattern: readfile($_REQUEST[$KEY])

  - id: wp-open-redirect-superglobal-medium
    languages: [php]
    severity: WARNING
    message: >
      Redirects to a URL taken from a request superglobal (open redirect).
    metadata:
      cwe:
        - "CWE-601: URL Redirection to Untrusted Site ('Open Redirect')"
    pattern-either:
      - pattern: wp_redirect($_GET[$KEY])
      - pattern: wp_redirect($_REQUEST[$KEY])
      - pattern: wp_redirect($_POST[$KEY])

  - id: wp-ajax-dispatch-missing-nonce-high
    languages: [php]
    severity: ERROR
    message: >
      Dispatches a request-supplied action without any nonce verification
      (CSRF-able privileged action).
    metadata:
      cwe:
        - "CWE-352: Cross-Site Request Forgery (CSRF)"
    patterns:
      - pattern-either:
          - pattern: $_GET["action"]
          - pattern: $_REQUEST["action"]
          - pattern: $_GET['action']
          - pattern: $_REQUEST['action']
      - pattern-not-inside: |
          function $FUNC(...) {
            ...
            check_ajax_referer(...);
            ...
          }
      - pattern-not-inside: |
          function $FUNC(...) {
            ...
            check_admin_referer(...);
            ...
          }
      - pattern-not-inside: |
          function $FUNC(...) {
            ...
            wp_verify_nonce(...);
            ...
          }

  - id: php-weak-hash-md5-medium
    languages: [php]
    severity: WARNING
    message: >
      MD5 over concatenated inputs used as a security value (predictable token).
    metadata:
      cwe:
        - "CWE-327: Use of a Broken or Risky Cryptographic Algorithm"
    pattern-either:
      - pattern: md5($A . $B)
      - pattern: md5($_GET[$KEY])
      - pattern: md5($_REQUEST[$KEY])
      - pattern: md5(uniqid())
''']

[scanner.performance]
enable_incremental_scan = true
enable_root_cause_dedup = true
enable_multi_verifier = false
enable_variant_search = true
enable_cve_bootstrap = true
enable_threat_modeling = false

[llm]
timeout_secs = 90
max_concurrent = 6
temperature = 0.2
enable_llm_cache = true

[llm.phases.discovery]
models = ["mistral-small"]

[llm.phases.verification]
model = "mistral-medium"

[llm.phases.aggregation]
model = "mistral-medium"

[triage]
enabled = true
model = "mistral-small"
batch_size = 8
suspicion_threshold = 0.35

[priority]
entry_point_patterns = [
  "wp-admin/admin-post.php",
  "wp-admin/admin-ajax.php",
  "wp-admin/includes/*",
  "wp-admin/options.php",
  "wp-includes/rest-api/*",
  "wp-includes/class-wp-xmlrpc-server.php",
  "xmlrpc.php",
  "wp-admin/includes/file.php",
  "wp-admin/includes/image.php",
  "wp-includes/pluggable.php",
  "wp-includes/user.php",
  "wp-includes/formatting.php",
  "wp-includes/kses.php",
  "add_action(",
  "add_filter(",
  "register_rest_route(",
  "register_activation_hook(",
  "wp_ajax_",
  "admin_post_",
]
sink_patterns = [
  "$wpdb->query",
  "$wpdb->get_results",
  "$wpdb->prepare",
  "unserialize(",
  "maybe_unserialize(",
  "eval(",
  "create_function(",
  "preg_replace(.*e'",
  "$_GET",
  "$_POST",
  "$_REQUEST",
  "$_FILES",
  "$_COOKIE",
  "wp_handle_upload",
  "move_uploaded_file",
  "system(",
  "exec(",
  "shell_exec(",
  "passthru(",
  "proc_open(",
  "include(",
  "require(",
  "include_once",
  "require_once",
  "wp_redirect",
  "wp_kses(",
  "file_get_contents(",
  "fopen(",
  "md5(",
]


[budget]
enabled = true
max_llm_calls = 600

[knowledge.fp_patterns]
"CWE-79" = [
  "esc_html(",
  "esc_attr(",
  "esc_url(",
  "wp_kses_post(",
  "esc_textarea(",
  "esc_js(",
]
"CWE-89" = ["$wpdb->prepare("]
"CWE-352" = [
  "check_admin_referer(",
  "wp_verify_nonce(",
  "check_ajax_referer(",
]
"CWE-862" = ["current_user_can(", "user_can(", "is_admin()"]

[knowledge.required_security_primitives]
"php" = ["wp_verify_nonce", "check_admin_referer", "check_ajax_referer", "current_user_can", "user_can"]

[knowledge.hook_registry.php]
hook_label = "rest_route"
registrations = [
    '''(?si)add_action\s*\(\s*[\x27\x22](?P<hook>(?:wp_ajax|wp_ajax_nopriv|admin_post|admin_post_nopriv)[^\x27\x22]*)[\x27\x22]\s*,\s*''',
    '''(?si)register_rest_route\s*\([^;]*?[\x27\x22]callback[\x27\x22]\s*=>\s*''',
]

[agent_flow]
enabled = false
requires_instrumented_target = false

[agent]
enabled = false
trusted_paths = []