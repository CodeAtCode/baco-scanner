# BACO preset — WordPress plugin
[project]
name = "wordpress-plugin"
languages = ["php", "javascript"]

[scanner]
max_file_size_kb = 512
exclude_paths = [
  "node_modules/*",
  "vendor/*",
  "dist/*",
  "build/*",
  "assets/*",
  "*.min.js",
  "*.min.css",
  "tests/*",
  "test/*",
  "spec/*",
  "cypress/*",
  "playwright/*",
  "*.map",
]

[scanner.semgrep]
rulesets = ["p/wordpress", "p/php", "p/security"]
# Inline semgrep rules, materialized to temp files at scan time and passed as
# extra --config args. Keeps the preset self-contained (no external rules file).
custom_rules = ['''
rules:
  - id: wp-superglobal-file-read-high
    languages: [php]
    severity: ERROR
    message: >
      Reads a file path directly from a request superglobal, allowing arbitrary
      file read / path traversal.
    metadata:
      cwe:
        - "CWE-22: Improper Limitation of a Pathname to a Restricted Directory"
    pattern-either:
      - pattern: file_get_contents($_GET[$KEY])
      - pattern: file_get_contents($_REQUEST[$KEY])
      - pattern: file_get_contents($_POST[$KEY])
      - pattern: readfile($_GET[$KEY])
      - pattern: readfile($_REQUEST[$KEY])

  - id: wp-open-redirect-superglobal-medium
    languages: [php]
    severity: WARNING
    message: >
      Redirects to a URL taken from a request superglobal (open redirect).
    metadata:
      cwe:
        - "CWE-601: URL Redirection to Untrusted Site ('Open Redirect')"
    pattern-either:
      - pattern: wp_redirect($_GET[$KEY])
      - pattern: wp_redirect($_REQUEST[$KEY])
      - pattern: wp_redirect($_POST[$KEY])

  - id: wp-ajax-dispatch-missing-nonce-high
    languages: [php]
    severity: ERROR
    message: >
      Dispatches a request-supplied action without any nonce verification
      (CSRF-able privileged action).
    metadata:
      cwe:
        - "CWE-352: Cross-Site Request Forgery (CSRF)"
    patterns:
      - pattern-either:
          - pattern: $_GET["action"]
          - pattern: $_REQUEST["action"]
          - pattern: $_GET['action']
          - pattern: $_REQUEST['action']
      - pattern-not-inside: |
          function $FUNC(...) {
            ...
            check_ajax_referer(...);
            ...
          }
      - pattern-not-inside: |
          function $FUNC(...) {
            ...
            check_admin_referer(...);
            ...
          }
      - pattern-not-inside: |
          function $FUNC(...) {
            ...
            wp_verify_nonce(...);
            ...
          }

  - id: php-weak-hash-md5-medium
    languages: [php]
    severity: WARNING
    message: >
      MD5 over concatenated inputs used as a security value (predictable token).
    metadata:
      cwe:
        - "CWE-327: Use of a Broken or Risky Cryptographic Algorithm"
    pattern-either:
      - pattern: md5($A . $B)
      - pattern: md5($_GET[$KEY])
      - pattern: md5($_REQUEST[$KEY])
      - pattern: md5(uniqid())
''']

[scanner.performance]
enable_incremental_scan = true
enable_multi_verifier = false
enable_variant_search = true
enable_cve_bootstrap = true

[llm]
temperature = 0.2
max_concurrent = 4
enable_llm_cache = true

[llm.phases.discovery]
models = ["mistral-small"]

[llm.phases.verification]
model = "mistral-medium"

[llm.phases.aggregation]
model = "mistral-medium"

[triage]
enabled = true
model = "mistral-small"
batch_size = 8
suspicion_threshold = 0.30

[priority]
entry_point_patterns = [
  "add_action(",
  "add_filter(",
  "register_rest_route(",
  "register_activation_hook(",
  "register_admin_menu_page(",
  "admin_post_",
  "wp_ajax_",
  "init.php",
  "admin.php",
  "uninstall.php",
  "xmlrpc",
]
sink_patterns = [
  "$wpdb->query",
  "$wpdb->get_results",
  "$wpdb->prepare",
  "unserialize(",
  "maybe_unserialize(",
  "eval(",
  "assert(",
  "preg_replace(",
  "$_GET",
  "$_POST",
  "$_REQUEST",
  "$_FILES",
  "move_uploaded_file(",
  "file_get_contents(",
  "fopen(",
  "include",
  "require",
  "wp_enqueue_script",
  "wp_localize_script",
  "wp_add_inline_script",
  "header('Location:",
  "wp_redirect(",
  "wp_safe_redirect(",
  "curl_init(",
  "wp_remote_get(",
  "wp_remote_post(",
  "base64_decode(",
  "str_rot13(",
  "gzinflate(",
  "shell_exec",
  "system(",
  "exec(",
  "passthru(",
]

[budget]
enabled = true
max_llm_calls = 250

[knowledge.fp_patterns]
"CWE-79" = [
  "esc_html(",
  "esc_attr(",
  "esc_url(",
  "wp_kses",
  "sanitize_text_field(",
]
"CWE-89" = [
  "$wpdb->prepare(",
  "$wpdb->insert(",
  "$wpdb->update(",
  "$wpdb->delete(",
]
"CWE-352" = [
  "wp_verify_nonce(",
  "check_admin_referer(",
  "check_ajax_referer(",
]
"CWE-862" = ["current_user_can(", "is_admin()", "manage_options"]

[knowledge.required_security_primitives]
"php" = ["wp_verify_nonce", "check_admin_referer", "check_ajax_referer", "current_user_can", "user_can"]

[knowledge.hook_registry.php]
hook_label = "rest_route"
registrations = [
    '''(?si)add_action\s*\(\s*[\x27\x22](?P<hook>(?:wp_ajax|wp_ajax_nopriv|admin_post|admin_post_nopriv)[^\x27\x22]*)[\x27\x22]\s*,\s*''',
    '''(?si)register_rest_route\s*\([^;]*?[\x27\x22]callback[\x27\x22]\s*=>\s*''',
]

[agent_flow]
enabled = false
requires_instrumented_target = false

[agent]
enabled = false
trusted_paths = []