# BACO preset — Large Python OSS project
[project]
name = "oss-python"
languages = ["python"]

[scanner]
max_file_size_kb = 512
exclude_paths = [
  "node_modules/*",
  "vendor/*",
  "third_party/*",
  "thirdparty/*",
  "external/*",
  "deps/*",
  "submodules/*",
  "tests/*",
  "test/*",
  "testing/*",
  "spec/*",
  "e2e/*",
  "fixtures/*",
  "docs/*",
  "examples/*",
  "samples/*",
  "demo/*",
  "benchmarks/*",
  "dist/*",
  "build/*",
  "out/*",
  "target/*",
  ".venv/*",
  "site-packages/*",
  "*.min.js",
  "*.bundle.js",
  "*.map",
  "*_pb2.py",
  "*.pb.cc",
  "*.pb.h",
]

[scanner.semgrep]
rulesets = ["p/python", "p/bandit", "p/security"]
custom_rules = ['''
rules:
  - id: py-taint-sqli-high
    languages: [python]
    mode: taint
    severity: ERROR
    message: >
      User input flows into database query without sanitization, SQL injection risk.
    metadata:
      cwe:
        - "CWE-89: Improper Neutralization of Special Elements used in an SQL Command"
    pattern-sources:
      - pattern: request.args.get($KEY)
      - pattern: request.form.get($KEY)
      - pattern: request.values.get($KEY)
      - pattern: request.json.get($KEY)
    pattern-sinks:
      - pattern: cursor.execute($SQL)
      - pattern: session.execute($SQL)
      - pattern: db.execute($SQL)

  - id: py-taint-cmdi-high
    languages: [python]
    mode: taint
    severity: ERROR
    message: >
      User input flows into command execution without sanitization, command injection risk.
    metadata:
      cwe:
        - "CWE-78: Improper Neutralization of Special Elements used in an OS Command"
    pattern-sources:
      - pattern: request.args.get($KEY)
      - pattern: request.form.get($KEY)
    pattern-sinks:
      - pattern: subprocess.call($CMD, shell=True)
      - pattern: subprocess.Popen($CMD, shell=True)
      - pattern: os.system($CMD)

  - id: py-taint-path-traversal-high
    languages: [python]
    mode: taint
    severity: ERROR
    message: >
      User input flows into file operations without validation, path traversal risk.
    metadata:
      cwe:
        - "CWE-22: Improper Limitation of a Pathname to a Restricted Directory"
    pattern-sources:
      - pattern: request.args.get($KEY)
      - pattern: request.form.get($KEY)
    pattern-sinks:
      - pattern: open($PATH)
      - pattern: os.open($PATH, $MODE)
''']

[scanner.performance]

[llm]
enable_llm_cache = true

[llm.phases.discovery]
models = ["mistral-small"]

[llm.phases.verification]
model = "mistral-medium"

[llm.phases.aggregation]
model = "mistral-medium"

[triage]
enabled = true
batch_size = 10
suspicion_threshold = 0.40

[priority]
entry_point_patterns = [
  "main.py",
  "app.py",
  "server.py",
  "cli/",
  "api/",
  "routes/",
  "controllers/",
  "handlers/",
  "endpoints/",
  "cmd/",
]
sink_patterns = [
  "system(",
  "exec",
  "popen",
  "shell=True",
  "eval(",
  "unserialize",
  "SELECT",
  "query(",
  "execute(",
  "os.system",
  "subprocess",
  "open(",
  "pickle.",
  "yaml.load",
]

[budget]
enabled = true
max_llm_calls = 1000
[agent]
enabled = false
